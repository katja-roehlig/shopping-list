<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json" />
    <!-- <link rel="icon" type="image/svg+xml" href="favicon.svg" /> -->
     <link rel ="icon" type="image/png" href="logo.png?v=2"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/main.css" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker erfolgreich registriert!', reg))
          .catch(err => console.error('Service Worker Fehler:', err));
          });
          }
    </script>
    <title>Einkaufsliste</title>
  </head>
  <body>
    <main class="main">
      <h1 class="main__heading">Einkaufsliste</h1>

      <form onsubmit="return false" class="store">
        <label for="store" class="visually-hidden">Geschäft</label>
        <input
          type="text"
          id="store"
          class="store__input"
          placeholder="Store"
          required
        />

      <button class="store__btn">
  <svg width="24" height="24" fill="currentColor" class="bi bi-check2" viewBox="0 0 16 16">
    <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
  </svg>
</button>
    </form>
      </form>

      <h2 class="main__subheading"></h2>


      <form onsubmit="return false" class="shopping-item">
        <label for="shopping-text" class="visually-hidden">Ware eintragen</label
        ><input
          type="text"
          id="shopping-text"
          class="shopping-item__input"
          placeholder="Was brauchst du?"
          autocomplete="off"
        />
        <button class="btn shopping-item__btn" type="button">
          <svg width="15" height="15" fill="white" class="bi bi-plus-lg" viewBox="2 2 12 12">
          <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z"/>
        </svg></button>
      </form>
      <ul class="list"></ul>
      <div class="btn-wrapper">
      <button class="btn btn-delete"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="white" class="bi bi-x-lg" viewBox="0 0 16 16">
        <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
      </svg></button></div>
    </main>
  

    <script src="./public/script.js"></script>
  </body>
</html>
